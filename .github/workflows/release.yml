name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ElixirIDE_x64.dmg
            installer: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ElixirIDE_arm64.dmg
            installer: dmg
            env:
              MACOSX_DEPLOYMENT_TARGET: '11.0'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ElixirIDE_x64.msi
            installer: msi
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ElixirIDE_x64.AppImage
            installer: appimage
            env:
              CC: gcc
              CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libssl-dev \
            pkg-config \
            libudev-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ElixirIDE ${{ github.ref_name }}'
          releaseBody: |
            ## ElixirIDE ${{ github.ref_name }}

            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Downloads
            - **macOS (Intel)**: `ElixirIDE_x64.dmg`
            - **macOS (Apple Silicon)**: `ElixirIDE_arm64.dmg`
            - **Windows**: `ElixirIDE_x64.msi`
            - **Linux**: `ElixirIDE_x64.AppImage`

            ### Verification
            All binaries are signed and notarized.
          prerelease: false
          draft: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          retention-days: 30

  updater:
    name: Generate Updater Manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate manifest
        run: |
          cd artifacts
          # Generate SHA256 checksums
          for f in $(find . -name "*.dmg" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm"); do
            sha256sum "$f" >> sha256sums.txt
          done
          cat sha256sums.txt

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: artifacts/
          retention-days: 90

  notify:
    name: Notify Release
    needs: [build, updater]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        if: success()
        run: |
          echo "Release ${{ github.ref_name }} published successfully"
          echo "Artifacts available at: https://github.com/elixcode-space/elix-ide/releases/tag/${{ github.ref_name }}"
        shell: bash